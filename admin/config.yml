backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "catalog"
    label: "Каталог"
    files:
      - name: "products"
        label: "Товары"
        file: "content/products.json"
        fields:
          - label: "Список товаров"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.price}} руб."
            fields:
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Категория", name: "category", widget: "select", options: ["Рыба", "Чай", "Кофе", "Сладости", "Бытовая химия"] }
              - { label: "Цена (руб.)", name: "price", widget: "number", value_type: "int" }
              - { label: "Фото", name: "image", widget: "image" }
              - { label: "Описание", name: "description", widget: "text" }
              - { label: "В наличии", name: "in_stock", widget: "boolean", default: true }
